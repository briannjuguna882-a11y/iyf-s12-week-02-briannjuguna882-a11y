<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    
<link rel="stylesheet" href="styles.css">

</head>

<body>
    

<header>
    <h1>Contact Me</h1>

    <nav>
        <a href="index.html">Home</a> |
        <a href="about.html">About</a> |
        <a href="projects.html">Projects</a> |
        <a href="contact.html" aria-current="page">Contact</a>
    </nav>
</header>

<main class="contact-layout">

    <form class="contact-form">

        <fieldset>
            <legend>Contact Information</legend>

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your full name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="Enter your phone number" required>

            <label for="subject">Subject:</label>
            <select id="subject" name="subject" required>
                <option value="">Choose a subject</option>
                <option value="general">General Inquiry</option>
                <option value="work">Work</option>
                <option value="feedback">Feedback</option>
            </select>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="6"
                      placeholder="Enter your message (minimum 50 characters)"
                      minlength="50" required></textarea>

            <div class="newsletter-option">
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to my newsletter</label>
            </div>

            <button type="submit">Send Message</button>
        </fieldset>

    </form>

    <aside class="contact-sidebar">
        <h2>Get in Touch</h2>
        <p>Thank you for visiting my portfolio.</p>
        <p>Feel free to contact me about my projects, technology,
           or professional opportunities.</p>
    </aside>

</main>

</body>
</html>
